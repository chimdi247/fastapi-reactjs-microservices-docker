# Mounted read-only into the prometheus container (docker-compose.yaml).
# Alerting rules live in Grafana's own provisioned alerting instead of here
# - see observability/grafana/provisioning/alerting/ - so this file is
# scrape configuration only.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Application metrics: every service's OTel SDK exports metrics via OTLP
  # to the collector, which re-exposes them here for scraping (see
  # observability/otel-collector/otel-collector-config.yaml).
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  # Per-container CPU/memory/network utilization.
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # Host (node) CPU/memory/disk utilization.
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
