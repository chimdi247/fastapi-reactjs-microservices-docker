apiVersion: 1

contactPoints:
  - orgId: 1
    name: ops-team
    receivers:
      - uid: ops-team-email
        type: email
        settings:
          # Placeholder - Grafana has no SMTP server configured out of the
          # box (see observability/README.md), so this contact point exists
          # and alerts will show as "firing" in the Grafana UI, but no email
          # actually sends until SMTP is configured via GF_SMTP_* env vars
          # and this address is replaced with a real one.
          addresses: ${ALERT_EMAIL_TO}
