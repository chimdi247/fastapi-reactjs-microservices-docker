# Frontend container: serves the React SPA and forwards API calls to Traefik.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve Traefik at request time via Docker DNS, so nginx still starts
    # if Traefik isn't up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway "traefik:80";

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # API: forward to Traefik, which routes by path (see compose labels):
    #   /users /login /products /docs /openapi.json -> user-service
    #   /orders                                      -> order-service
    #   /inventory                                   -> inventory-service
    # Keep this path list in sync with the Traefik rules.


    location ~ ^/(users|login|products|orders|inventory|docs|openapi\.json)(/|$) {
        # No URI part: path and query string pass through unchanged.
        proxy_pass http://$gateway;
        proxy_http_version 1.1;

        # Preserve client info for the backends.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";   # allow upstream keep-alive

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # SPA: unknown paths fall back to index.html for client-side routing.

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html, so a deploy is picked up immediately.

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets: cache for a year; a missing file is a 404.
    
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
